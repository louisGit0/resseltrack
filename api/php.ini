; Ensure $_ENV superglobal is populated from OS-level env vars (Vercel injects at OS level).
; Env::get() uses getenv() which works without this, but belt-and-suspenders for any
; code that reads $_ENV directly.
variables_order = EGPCS

; Headroom for Composer autoload + request processing
memory_limit = 256M

; Disable dangerous functions not needed in serverless
disable_functions = exec,passthru,shell_exec,system,proc_open,popen

; Disable PHP's probabilistic GC (default 1/100 per request).
; DatabaseSessionHandler uses lazy read-time expiry (expires_at column).
; Run session_gc() explicitly from a maintenance endpoint if bulk cleanup is needed.
session.gc_probability = 0

; STORE-05: Layered upload size defence — php.ini (5M) > app guard (3.5MB) > Vercel raw limit (4.5MB, raw 413).
; Without these, PHP silently empties $_FILES for a valid 3.x MB file before the app-level guard fires.
upload_max_filesize = 5M
post_max_size = 5M
